version: '3'

services:
    source_postgres:
      image: postgres:17
      ports:
        - "5433:5432"
      networks:
        - elt_network
      environment:
        POSTGRES_DB: source_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: secret
      volumes: 
        - ./source_db_init/init.sql:/docker-entrypoint-initdb.d/init.sql
      
    destination_postgres:
      image: postgres:17
      ports:
        - "5434:5432"
      networks:
        - elt_network
      environment:
        POSTGRES_DB: destination_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: secret


    elt_script:
      build:
        context: ./elt
        dockerfile: Dockerfile
      command: ['python3', 'elt_script.py']
      networks:
        - elt_network
      depends_on:
        - source_postgres
        - destination_postgres
  
# airflow service
    postgres:
      image: postgres:17
      networks:
        elt_network
      environment:
        POSTGRES_USER=airflow
        POSTGRES_PASSWORD=airflow
        POSTGRES_DB=airflow
    init-airflow:
      image: apache/airflow:latest
      depend_on:
        - postgres
      networks:
        - elt_network
      environment:
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgres+psycopg2://airflow:airflow@postgres/airflow
      command: >
        bash -c "airflow db init &&
                airflow users create --username airflow --password --firstname John --lastname Doe --role Admin --email admin@example.com"
      
    
    webserver:
      build:
        context: .
        dockerfile: Dockerfile
      user: root
      depends_on:
        - postgres
      networks:
        - elt_network
      extra_hosts:
        - "host.docker.internal:host-getway"
      volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./elt:/opt/airflow/elt
        - /var/run/docker.sock:/var/run/docker.sock
      environment:
        LOAD_EX=n
        EXECUTOR=Local
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgres+psycopg2://airflow:airflow@postgres/airflow
        AIRFLOW__CORE__FERTNET_KEY=V5Tjymbh6HQ46NfgBX2JMayq95hmWNGsLmJyXay1VMY=
        AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=airflow
        AIRFLOW__WEBSERVER__DEFAULT__USER_PASSWORD=password
        AIRFLOW_WWW_USER_USERNAME=airflow
        AIRFLOW_WWW_USER_PASSWORD=password
        AIRFLOW__WEBSERVER__SECRET_KEY=secret
      ports:
        -"8080:8080"
      command: webserver

    
    scheduler:
      build:
        context: .
        dockerfile: Dockerfile
      user: root
      depends_on:
        - postgres
      networks:
        - elt_network
      extra_hosts:
        - "host.docker.internal:host-getway"
      volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./elt:/opt/airflow/elt
        - /var/run/docker.sock:/var/run/docker.sock
      environment:
        LOAD_EX=n
        EXECUTOR=Local
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgres+psycopg2://airflow:airflow@postgres/airflow
        AIRFLOW__CORE__FERTNET_KEY=V5Tjymbh6HQ46NfgBX2JMayq95hmWNGsLmJyXay1VMY=
        AIRFLOW__WEBSERVER__DEFAULT__USER_USERNAME=airflow
        AIRFLOW__WEBSERVER__DEFAULT__USER_PASSWORD=password
        AIRFLOW_WWW_USER_USERNAME=airflow
        AIRFLOW_WWW_USER_PASSWORD=password
        AIRFLOW__WEBSERVER__SECRET_KEY=secret
      ports:
        - "8080:8080"
      command: scheduler
        








      

networks:
  elt_network:
    driver: bridge